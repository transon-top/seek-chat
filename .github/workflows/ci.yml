name: CI

# 分支与 PR 跑测试线；tag push 只走 release.yml，避免重复。
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: 生成物检查、静态检查与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          architecture: x64
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 重跑代码生成
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: 检查生成物漂移
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::生成物与提交不一致：请在本地重跑 build_runner 与 gen-l10n 后提交。"
            exit 1
          fi

      - name: 静态检查
        run: flutter analyze

      - name: 测试
        run: flutter test
