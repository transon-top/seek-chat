name: open_chat
description: "Open Chat: a Flutter DeepSeek chat app for iOS and Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  drift: ^2.35.4
  sqlite3: ^3.9.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_secure_storage: ^11.2.0
  gpt_markdown: ^1.4.1
  mermaid_flutter: ^0.3.2
  mermaid_core: ^0.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  val_latex_flutter: ^0.1.4

flutter:
  uses-material-design: true
